<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Font Preview — Handwriting options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Indie+Flower&family=Kalam:wght@700&family=Patrick+Hand&family=Dancing+Script:wght@700&family=Handlee&family=Architects+Daughter&family=Satisfy&family=Pacifico&family=Neucha&display=swap" rel="stylesheet">
<style>
  body { font-family: sans-serif; background: #f0f6ff; padding: 2rem; color: #374151; }
  h1 { font-size: 1.1rem; margin-bottom: 2rem; color: #6b7280; }
  .row { display: flex; align-items: baseline; gap: 1.5rem; padding: 1rem 1.5rem;
         background: #fff; border-radius: 10px; margin-bottom: 1rem;
         box-shadow: 0 1px 6px rgba(0,0,0,.07); }
  .label { font-size: 0.75rem; font-weight: 700; color: #9ca3af;
           letter-spacing: .08em; text-transform: uppercase; width: 160px; flex-shrink: 0; }
  .sample { font-size: 1.55rem; line-height: 1.3; }
  .current { border-left: 3px solid #3b6fb6; }

  /* colour classes matching the site */
  .nb { color: #3b82f6; font-weight: 700; }
  .nr { color: #ef4444; font-weight: 700; }
  .ny { color: #d97706; font-weight: 700; }
  .na { color: #9ca3af; }

  .f-caveat   { font-family: 'Caveat',              cursive; }
  .f-indie    { font-family: 'Indie Flower',         cursive; }
  .f-kalam    { font-family: 'Kalam',                cursive; }
  .f-patrick  { font-family: 'Patrick Hand',         cursive; }
  .f-dancing  { font-family: 'Dancing Script',       cursive; }
  .f-handlee  { font-family: 'Handlee',              cursive; }
  .f-arch     { font-family: 'Architects Daughter',  cursive; }
  .f-satisfy  { font-family: 'Satisfy',              cursive; }
  .f-pacifico { font-family: 'Pacifico',             cursive; }
  .f-neucha   { font-family: 'Neucha',               cursive; }
</style>
</head>
<body>
<h1>Handwriting font candidates — same prompt, same colour scheme</h1>

<script>
const prompt = [
  {a:'a ', n:'tie',          cls:'nb'},
  {a:'a ', n:'book',         cls:'nb'},
  {a:'a ', n:'dog',          cls:'nb'},
  {a:'',   n:'frisbee',      cls:'ny'},
  {a:'a ', n:'fork',         cls:'nr'},
];

function renderSample(fontClass) {
  const parts = prompt.map((w, i) => {
    const word = (w.a ? `<span class="na">${w.a}</span>` : '') +
                 `<span class="${w.cls}">${w.n}</span>`;
    return i === 0 ? word : `<span class="na"> and </span>` + word;
  });
  return `<span class="${fontClass}">“${parts.join('')}”</span>`;
}

const fonts = [
  ['f-caveat',   'Caveat (current)',         true],
  ['f-indie',    'Indie Flower',             false],
  ['f-kalam',    'Kalam',                    false],
  ['f-patrick',  'Patrick Hand',             false],
  ['f-dancing',  'Dancing Script',           false],
  ['f-handlee',  'Handlee',                  false],
  ['f-arch',     'Architects Daughter',      false],
  ['f-satisfy',  'Satisfy',                  false],
  ['f-pacifico', 'Pacifico',                 false],
  ['f-neucha',   'Neucha',                   false],
];

fonts.forEach(([cls, name, current]) => {
  const row = document.createElement('div');
  row.className = 'row' + (current ? ' current' : '');
  row.innerHTML = `<span class="label">${name}</span><span class="sample">${renderSample(cls)}</span>`;
  document.body.appendChild(row);
});
</script>
</body>
</html>
