<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temporal Preview — Frame Marker</title>
<style>
:root { --accent: #3b6fb6; --req: #334155; --tc: #f97316; --ours: #3b6fb6; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f0f6ff; padding: 1.5rem; color: #374151; }

h1  { font-size: 1rem; color: #6b7280; margin-bottom: .5rem; }
h2  { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: #9ca3af; margin: 2rem 0 .5rem; }

/* save bar */
.save-bar { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.save-btn {
  background: var(--accent); color:#fff; border:none; border-radius:7px;
  padding:.45rem 1.1rem; font-size:.88rem; font-weight:700; cursor:pointer;
}
.save-btn:hover { background: #2d57a0; }
.storage-note { font-size:.78rem; color:#10b981; display:none; }
.storage-note.show { display:inline; }

.save-out {
  display:none; background:#1e293b; color:#e2e8f0; border-radius:8px;
  padding:1rem 1.25rem; max-width:820px; margin-bottom:1.5rem; position:relative;
}
.save-out pre { font-size:.76rem; white-space:pre; overflow-x:auto; margin:0; }
.save-copy {
  position:absolute; top:.6rem; right:.75rem;
  background:#334155; color:#94a3b8; border:none; border-radius:5px;
  padding:.25rem .6rem; font-size:.72rem; cursor:pointer;
}
.save-copy:hover { background: var(--accent); color:#fff; }
.save-copy.ok    { background:#10b981; color:#fff; }

/* example card */
.example {
  background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.07);
  border-top:3px solid var(--accent); padding:1.1rem 1.4rem;
  margin-bottom:1.5rem; max-width:820px;
}
.ex-title { font-size:.9rem; font-weight:700; color:#1f2937; margin-bottom:.6rem; }

/* video/gif */
.media-wrap { max-width:480px; border-radius:6px; overflow:hidden;
              box-shadow:0 3px 10px rgba(0,0,0,.12); }
.media-wrap video, .media-wrap img { display:block; width:100%; }
.gif-note { font-size:.72rem; color:#9ca3af; margin:.3rem 0 .5rem; }

/* frame controls (mp4 only) */
.frame-controls { display:flex; align-items:center; gap:.5rem; margin:.6rem 0; flex-wrap:wrap; }
.fc-btn {
  background:#fff; border:2px solid #d1d5db; border-radius:6px;
  padding:.25rem .6rem; font-size:.88rem; cursor:pointer; color:#374151;
}
.fc-btn:hover { border-color:var(--accent); color:var(--accent); }
.fc-counter { font-size:.82rem; font-weight:700; min-width:70px; text-align:center; }
.fc-slider { flex:1; min-width:100px; accent-color:var(--accent); }

/* markers */
.markers { margin-top:.4rem; }
.obj-block { margin-bottom:.6rem; }
.obj-name {
  font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent); margin-bottom:.25rem;
}
.marker-row { display:flex; align-items:center; gap:.35rem; margin-bottom:.25rem; }
.row-label {
  font-size:.67rem; font-weight:700; width:88px; flex-shrink:0; text-align:right;
  color:#6b7280;
}
.row-label.req-label  { color:var(--req); }
.row-label.tc-label   { color:var(--tc); }
.row-label.ours-label { color:var(--ours); }

.cells { display:flex; gap:2px; }
.mcell {
  width:21px; height:18px; border-radius:3px; border:2px solid #e5e7eb;
  background:#f9fafb; cursor:pointer;
}
.mcell:hover { border-color:#9ca3af; }
.mcell.on.req-cell  { background:var(--req);  border-color:var(--req); }
.mcell.on.tc-cell   { background:var(--tc);   border-color:var(--tc); }
.mcell.on.ours-cell { background:var(--ours); border-color:var(--ours); }
.mcell.cur { outline:2px solid #fbbf24; outline-offset:1px; }

.data-out { display:flex; flex-wrap:wrap; gap:.25rem .5rem; margin-top:.3rem; margin-left:92px; }
.data-line { font-family:monospace; font-size:.7rem; display:flex; align-items:center; gap:.35rem; }
.copy-btn {
  font-size:.65rem; background:#f3f4f6; border:1px solid #d1d5db;
  border-radius:4px; padding:.1rem .35rem; cursor:pointer; color:#6b7280;
}
.copy-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.copy-btn.ok { background:#10b981; color:#fff; border-color:#10b981; }
</style>
</head>
<body>

<h1>Temporal control — frame-by-frame marker &nbsp;·&nbsp;
  click cells to toggle presence &nbsp;·&nbsp;
  <kbd>←</kbd><kbd>→</kbd> to step (focus video first) &nbsp;·&nbsp;
  <strong style="color:#10b981;">auto-saved to browser localStorage</strong></h1>

<div class="save-bar">
  <button class="save-btn" id="save-btn">💾 Export DETECTED dict</button>
  <span class="storage-note" id="storage-note">✓ State restored from last session</span>
</div>
<div class="save-out" id="save-out">
  <button class="save-copy" id="save-copy">copy</button>
  <pre id="save-pre"></pre>
</div>

<div id="examples-mount"></div>

<script>
const NF = 13;
const LS_KEY = 'temporal-preview-v2';

/* ════════════════════════════════════════════════════════════
   EXAMPLES — paper (MP4, seekable) then supplementary (GIF)
   objects[i]: { name, req, tc, ours }  — initial best guesses
   For GIFs req/tc/ours default to all-zeros (user marks from scratch).
   detected_key / detected_obj used only in Save output.
   ════════════════════════════════════════════════════════════ */
const ZERO = '0'.repeat(NF);

const EXAMPLES = [
  // ── Paper examples (MP4) ────────────────────────────────
  {
    id:'sandwich', title:'1 · Sandwich  (LTX-2 · single)',
    src:'static/videos/temporal/temporal_paper_sandwich.mp4',
    dur:3.92, type:'mp4',
    detected_key:'sandwich', detected_obj:'sandwich',
    objects:[{ name:'sandwich', req:'0000000111111', tc:'1111111111111', ours:'0000000111111' }]
  },
  {
    id:'car', title:'2 · Car  (LTX-2 · single)',
    src:'static/videos/temporal/temporal_paper_car.mp4',
    dur:3.92, type:'mp4',
    detected_key:'car', detected_obj:'car',
    objects:[{ name:'car', req:'0000000111111', tc:'1111111111111', ours:'0000000111111' }]
  },
  {
    id:'giraffe', title:'3 · Giraffe  (LTX-2 · single)',
    src:'static/videos/temporal/temporal_paper_giraffe.mp4',
    dur:3.92, type:'mp4',
    detected_key:'giraffe', detected_obj:'giraffe',
    objects:[{ name:'giraffe', req:'1111111000000', tc:'1111111111111', ours:'1111111100000' }]
  },
  {
    id:'keyboard_phone', title:'4 · Keyboard + Phone  (LTX-2 · static+dynamic)',
    src:'static/videos/temporal/temporal_paper_keyboard_phone.mp4',
    dur:3.92, type:'mp4',
    detected_key:'keyboard_phone', detected_obj:'phone',
    objects:[
      { name:'keyboard', req:'1111111111111', tc:'1111111111111', ours:'1111111111111' },
      { name:'phone',    req:'0000000111111', tc:'1111111111111', ours:'0000000111111' }
    ]
  },
  {
    id:'teddy_bear_paper', title:'5 · Teddy Bear  (Wan 2.1 · single)',
    src:'static/videos/temporal/temporal_paper_teddy_bear.mp4',
    dur:5.125, type:'mp4',
    detected_key:'teddy_bear', detected_obj:'teddy bear',
    objects:[{ name:'teddy bear', req:'0000000000011', tc:'0000000011111', ours:'0000000000011' }]
  },

  // ── Supplementary examples (GIF, watch-only) ─────────────
  {
    id:'s_teddy_bear', title:'S1 · Teddy Bear  (LTX-2 · single)',
    src:'static/gifs/temporal_teddy_bear.gif',
    type:'gif', detected_key:'teddy_bear_supp', detected_obj:'teddy bear',
    objects:[{ name:'teddy bear', req:ZERO, tc:ZERO, ours:ZERO }]
  },
  {
    id:'s_giraffe', title:'S2 · Giraffe  (LTX-2 · single)',
    src:'static/gifs/temporal_giraffe.gif',
    type:'gif', detected_key:'giraffe_supp', detected_obj:'giraffe',
    objects:[{ name:'giraffe', req:ZERO, tc:ZERO, ours:ZERO }]
  },
  {
    id:'s_remote', title:'S3 · Remote  (LTX-2 · single)',
    src:'static/gifs/temporal_remote.gif',
    type:'gif', detected_key:'remote', detected_obj:'remote',
    objects:[{ name:'remote', req:ZERO, tc:ZERO, ours:ZERO }]
  },
  {
    id:'s_person', title:'S4 · Person  (LTX-2 · single)',
    src:'static/gifs/temporal_person.gif',
    type:'gif', detected_key:'person', detected_obj:'person',
    objects:[{ name:'person', req:ZERO, tc:ZERO, ours:ZERO }]
  },
  {
    id:'s_fire_hydrant', title:'S5 · Fire Hydrant  (LTX-2 · single)',
    src:'static/gifs/temporal_fire_hydrant.gif',
    type:'gif', detected_key:'fire_hydrant', detected_obj:'fire hydrant',
    objects:[{ name:'fire hydrant', req:ZERO, tc:ZERO, ours:ZERO }]
  },
  {
    id:'s_boat_airplane', title:'S6 · Boat + Airplane  (LTX-2 · static+dynamic)',
    src:'static/gifs/temporal_boat_airplane.gif',
    type:'gif', detected_key:'boat_airplane', detected_obj:'airplane',
    objects:[
      { name:'boat',     req:ZERO, tc:ZERO, ours:ZERO },
      { name:'airplane', req:ZERO, tc:ZERO, ours:ZERO }
    ]
  },
  {
    id:'s_teddy_bear_frisbee', title:'S7 · Teddy Bear + Frisbee  (LTX-2 · static+dynamic)',
    src:'static/gifs/temporal_teddy_bear_frisbee.gif',
    type:'gif', detected_key:'teddy_bear_frisbee', detected_obj:'frisbee',
    objects:[
      { name:'teddy bear', req:ZERO, tc:ZERO, ours:ZERO },
      { name:'frisbee',    req:ZERO, tc:ZERO, ours:ZERO }
    ]
  },
  {
    id:'s_bicycle_car', title:'S8 · Bicycle + Car  (LTX-2 · static+dynamic)',
    src:'static/gifs/temporal_bicycle_car.gif',
    type:'gif', detected_key:'bicycle_car', detected_obj:'car',
    objects:[
      { name:'bicycle', req:ZERO, tc:ZERO, ours:ZERO },
      { name:'car',     req:ZERO, tc:ZERO, ours:ZERO }
    ]
  },
];

/* ════════════════════════════════════════════════════════════
   STATE — persisted to localStorage
   ════════════════════════════════════════════════════════════ */
const state    = {};   // exId → objName → {req,tc,ours}: bool[]
const curFrame = {};   // exId → 0-12

function initState(ex) {
  curFrame[ex.id] = 0;
  if (state[ex.id]) return;   // already restored from storage
  state[ex.id] = {};
  ex.objects.forEach(o => {
    state[ex.id][o.name] = {
      req:  o.req.split('').map(c => c === '1'),
      tc:   o.tc.split('').map(c => c === '1'),
      ours: o.ours.split('').map(c => c === '1'),
    };
  });
}

function saveLS() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadLS() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
    return true;
  } catch(e) { return false; }
}

const restored = loadLS();

/* ════════════════════════════════════════════════════════════
   BUILD ONE EXAMPLE CARD
   ════════════════════════════════════════════════════════════ */
function dataStr(bits) { return bits.map(b => b ? '1' : '0').join(','); }

function buildExample(ex) {
  initState(ex);
  const card = document.createElement('div');
  card.className = 'example';
  card.id = 'ex-' + ex.id;

  const title = document.createElement('div');
  title.className = 'ex-title';
  title.textContent = ex.title;
  card.appendChild(title);

  // ── media ──
  const mwrap = document.createElement('div');
  mwrap.className = 'media-wrap';

  if (ex.type === 'mp4') {
    const vid = document.createElement('video');
    vid.src = ex.src; vid.muted = true; vid.loop = false;
    vid.playsInline = true; vid.tabIndex = 0;
    vid.id = 'vid-' + ex.id;
    vid.title = 'Click to play/pause · ←→ to step';
    mwrap.appendChild(vid);
    card.appendChild(mwrap);
    card.appendChild(buildFrameControls(ex, vid));
  } else {
    const img = document.createElement('img');
    img.src = ex.src; img.alt = ex.title;
    mwrap.appendChild(img);
    card.appendChild(mwrap);
    const note = document.createElement('div');
    note.className = 'gif-note';
    note.textContent = 'GIF — watch the loop; mark frames by clicking the cells below.  Req = read the green bar baked into the GIF.';
    card.appendChild(note);
  }

  // ── marker rows ──
  const markersEl = document.createElement('div');
  markersEl.className = 'markers';
  const cellEls = {};

  ex.objects.forEach(obj => {
    cellEls[obj.name] = {};
    const block = document.createElement('div');
    block.className = 'obj-block';

    const nameEl = document.createElement('div');
    nameEl.className = 'obj-name';
    nameEl.textContent = obj.name;
    block.appendChild(nameEl);

    const ROWS = [
      { key:'req',  label:'Requested',    cellCls:'req-cell',  lblCls:'req-label'  },
      { key:'tc',   label:'TempoControl', cellCls:'tc-cell',   lblCls:'tc-label'   },
      { key:'ours', label:'Ours',         cellCls:'ours-cell', lblCls:'ours-label' },
    ];

    ROWS.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'marker-row';

      const lbl = document.createElement('span');
      lbl.className = 'row-label ' + row.lblCls;
      lbl.textContent = row.label;
      rowEl.appendChild(lbl);

      const wrap = document.createElement('div');
      wrap.className = 'cells';
      cellEls[obj.name][row.key] = [];

      for (let f = 0; f < NF; f++) {
        const cell = document.createElement('div');
        const on = state[ex.id][obj.name][row.key][f];
        cell.className = 'mcell ' + row.cellCls + (on ? ' on' : '');
        cell.title = 'Frame ' + (f + 1);
        cell.addEventListener('click', () => {
          state[ex.id][obj.name][row.key][f] = !state[ex.id][obj.name][row.key][f];
          refreshCells(ex.id, cellEls);
          saveLS();
        });
        wrap.appendChild(cell);
        cellEls[obj.name][row.key].push(cell);
      }
      rowEl.appendChild(wrap);
      block.appendChild(rowEl);
    });

    // data-frames output
    const dataOut = document.createElement('div');
    dataOut.className = 'data-out';
    dataOut.id = 'data-' + ex.id + '-' + obj.name.replace(/\s+/g,'_');
    block.appendChild(dataOut);
    markersEl.appendChild(block);
  });

  card.appendChild(markersEl);
  refreshCells(ex.id, cellEls);  // initial render
  return card;
}

/* ── frame controls (MP4 only) ── */
function buildFrameControls(ex, vid) {
  const fc = document.createElement('div');
  fc.className = 'frame-controls';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'fc-btn'; prevBtn.textContent = '◀';
  const counter = document.createElement('span');
  counter.className = 'fc-counter'; counter.textContent = 'Frame 1 / 13';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'fc-btn'; nextBtn.textContent = '▶';
  const playBtn = document.createElement('button');
  playBtn.className = 'fc-btn'; playBtn.textContent = '⏵ Play';
  const slider = document.createElement('input');
  slider.type = 'range'; slider.className = 'fc-slider';
  slider.min = 0; slider.max = NF - 1; slider.value = 0;

  fc.append(prevBtn, counter, nextBtn, playBtn, slider);

  function goTo(f) {
    curFrame[ex.id] = Math.max(0, Math.min(NF - 1, f));
    vid.currentTime = (curFrame[ex.id] / (NF - 1)) * ex.dur;
    slider.value = curFrame[ex.id];
    counter.textContent = `Frame ${curFrame[ex.id] + 1} / ${NF}`;
    // refresh cur-frame highlight (need cellEls — look them up via DOM)
    document.querySelectorAll(`#ex-${ex.id} .mcell`).forEach(c => {
      const fi = [...c.parentNode.children].indexOf(c);
      c.classList.toggle('cur', fi === curFrame[ex.id]);
    });
  }

  prevBtn.addEventListener('click', () => goTo(curFrame[ex.id] - 1));
  nextBtn.addEventListener('click', () => goTo(curFrame[ex.id] + 1));
  slider.addEventListener('input', () => goTo(parseInt(slider.value)));

  playBtn.addEventListener('click', () => {
    if (vid.paused) { vid.play(); playBtn.textContent = '⏸ Pause'; }
    else            { vid.pause(); playBtn.textContent = '⏵ Play'; }
  });
  vid.addEventListener('click', () => {
    if (vid.paused) { vid.play(); playBtn.textContent = '⏸ Pause'; }
    else            { vid.pause(); playBtn.textContent = '⏵ Play'; }
  });
  vid.addEventListener('timeupdate', () => {
    if (!vid.paused) {
      const f = Math.round((vid.currentTime / ex.dur) * (NF - 1));
      curFrame[ex.id] = Math.max(0, Math.min(NF - 1, f));
      slider.value = curFrame[ex.id];
      counter.textContent = `Frame ${curFrame[ex.id] + 1} / ${NF}`;
      document.querySelectorAll(`#ex-${ex.id} .mcell`).forEach(c => {
        const fi = [...c.parentNode.children].indexOf(c);
        c.classList.toggle('cur', fi === curFrame[ex.id]);
      });
    }
  });
  vid.addEventListener('ended', () => { playBtn.textContent = '⏵ Play'; goTo(NF - 1); });
  vid.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); if (!vid.paused) vid.pause(); goTo(curFrame[ex.id] - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (!vid.paused) vid.pause(); goTo(curFrame[ex.id] + 1); }
  });

  return fc;
}

/* ── refresh cell on/cur classes + data-frames display ── */
function refreshCells(exId, cellElsArg) {
  const cf = curFrame[exId] || 0;
  const ex = EXAMPLES.find(e => e.id === exId);
  ex.objects.forEach(obj => {
    ['req','tc','ours'].forEach(rt => {
      // find cells in DOM if cellEls not passed (after restore)
      const cells = document.querySelectorAll(
        `#ex-${exId} .obj-block:nth-child(${ex.objects.indexOf(obj) + 1}) .marker-row:nth-child(${['req','tc','ours'].indexOf(rt) + 2}) .mcell`
      );
      cells.forEach((cell, fi) => {
        const on = state[exId]?.[obj.name]?.[rt]?.[fi] ?? false;
        cell.classList.toggle('on', on);
        cell.classList.toggle('cur', fi === cf);
      });
    });
    updateDataOut(exId, obj.name);
  });
}

function updateDataOut(exId, objName) {
  const el = document.getElementById('data-' + exId + '-' + objName.replace(/\s+/g,'_'));
  if (!el) return;
  el.innerHTML = '';
  ['req','tc','ours'].forEach(rt => {
    const bits = state[exId]?.[objName]?.[rt] ?? Array(NF).fill(false);
    const str  = dataStr(bits);
    const line = document.createElement('div');
    line.className = 'data-line';
    const labels = { req:'req', tc:'tc', ours:'ours' };
    line.innerHTML = `<span style="color:#9ca3af;min-width:34px;">${labels[rt]}</span><code>"${str}"</code>`;
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = 'copy';
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(str).then(() => {
        btn.textContent = '✓'; btn.classList.add('ok');
        setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('ok'); }, 1200);
      });
    });
    line.appendChild(btn);
    el.appendChild(line);
  });
}

/* ════════════════════════════════════════════════════════════
   BUILD PAGE
   ════════════════════════════════════════════════════════════ */
const mount = document.getElementById('examples-mount');

// section header: paper
const h2paper = document.createElement('h2');
h2paper.textContent = 'Paper examples (MP4 — seekable)';
mount.appendChild(h2paper);
EXAMPLES.filter(e => e.type === 'mp4').forEach(ex => mount.appendChild(buildExample(ex)));

// section header: supplementary
const h2supp = document.createElement('h2');
h2supp.textContent = 'Supplementary examples (GIF — watch loop, mark manually)';
mount.appendChild(h2supp);
EXAMPLES.filter(e => e.type === 'gif').forEach(ex => mount.appendChild(buildExample(ex)));

if (restored) document.getElementById('storage-note').classList.add('show');

/* ════════════════════════════════════════════════════════════
   SAVE / EXPORT
   ════════════════════════════════════════════════════════════ */
function buildOutput() {
  const paper = EXAMPLES.filter(e => e.type === 'mp4');
  const supp  = EXAMPLES.filter(e => e.type === 'gif');

  function dictBlock(examples, varName) {
    const lines = [`${varName} = {`];
    examples.forEach(ex => {
      const objName = ex.detected_obj;
      const s = state[ex.id]?.[objName];
      if (!s) return;
      const tc   = s.tc.map(b => b ? '1' : '0').join('');
      const ours = s.ours.map(b => b ? '1' : '0').join('');
      const req  = s.req.map(b => b ? '1' : '0').join('');
      lines.push(`    "${ex.detected_key}": {`);
      lines.push(`        "tc":   "${tc}",   # req: "${req}"`);
      lines.push(`        "ours": "${ours}",`);
      lines.push(`    },`);
    });
    lines.push('}');
    return lines.join('\n');
  }

  return [
    '# ── build_temporal_gifs_paper.py ─────────────────',
    dictBlock(paper, 'DETECTED'),
    '',
    '# ── build_temporal_gifs.py (supplementary) ───────',
    dictBlock(supp, 'DETECTED_SUPP'),
  ].join('\n');
}

document.getElementById('save-btn').addEventListener('click', () => {
  const out = document.getElementById('save-out');
  document.getElementById('save-pre').textContent = buildOutput();
  out.style.display = 'block';
  out.scrollIntoView({ behavior:'smooth', block:'nearest' });
});

const saveCopyBtn = document.getElementById('save-copy');
saveCopyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('save-pre').textContent).then(() => {
    saveCopyBtn.textContent = '✓ copied'; saveCopyBtn.classList.add('ok');
    setTimeout(() => { saveCopyBtn.textContent = 'copy'; saveCopyBtn.classList.remove('ok'); }, 1500);
  });
});
</script>
</body>
</html>
