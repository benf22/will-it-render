page_title: "Will It Render? Learned Attention Steering for Object Presence in Text-to-Video"

page_description: "AttnSteer: a learned cross-attention steering model that makes text-to-video diffusion models render every object the prompt requests."

og_description: "AttnSteer predicts object rendering from intermediate cross-attention and steers video latents toward it at inference time."

tldr: |
  **The problem**: not all requested objects are rendered by text-to-video models. **Our Solution**: trainning a tiny
  model (37k parameters) on the generator's attention maps which predict whether each requested
  object will render. Then, we use it as a differentiable steering signal at inference time —
  no model retraining, no hand-crafted objectives needed.
  
carousel_caption: |
  Each clip shows the **base model** (left) alongside **AttnSteer** (right),
  generated from the same prompt and seed.

abstract_p1: |
  Text-to-video diffusion models generate increasingly realistic videos, yet often fail to render all objects
  requested by the prompt, particularly as the number of objects grows. Improving such fine-grained adherence
  through training requires substantial video supervision, motivating inference-time methods that steer
  intermediate diffusion latents. Existing approaches typically define hand-crafted objectives over
  cross-attention maps, relying on indirect attention statistics rather than whether the model ultimately
  renders a requested object.

abstract_p2: |
  We propose **AttnSteer**, a learned attention-steering model that predicts object rendering directly from
  intermediate cross-attention. AttnSteer is trained entirely on the generator's own trajectories using
  automatically obtained detector labels and contains only 37k parameters. At inference time, its predictions
  define differentiable objectives for steering object presence; We also extend the current Vbench multi-object
  benchmark from 2 to 7 objects, and show that AttnSteer improves all-objects accuracy over the strongest 
  baseline at comparable video quality. The same framework also extends to frame-level temporal control and improve curent baseline.

method_inference_text: |
  At inference time, AttnSteer's predictions define differentiable objectives for steering object presence.
  The video latent is optimized while the generator stays fixed. For multi-object prompts, independent
  per-object updates can conflict: we filtering out objects which are likely to be rendered,
  for the remain objects we normalize each ones gradient, and aggragate all objects' gradients 
  while suppress locally opposing contributions.

method_inference_caption: |
  **Inference-time steering.** Top row - at selected denoising steps (yellow), we run a few optimization steps (purple).
  Bottom - in each optimization step we extract object's cross-attention maps and pass them throuh frozen AttnSteer 
  predictor (blue). Then we calculate the loss and backpropagate the gradient, together with filtering, normalization and aggragation
  logic (red pass) to update the latent.

method_training_text: |
  We train a tiny model - AttnSteer to predict whether each requested object will be rendered. We use per-step,
  per-layer, per-head cross-attention features from the frozen generator. Labels come from detectors
  run on the generator's own final videos.

method_training_caption: |
  **Training with self-generated supervision.** Cross-attention features from the frozen generator
  are paired with detector labels from its final video.

steering_process_text: |
  Each row shows the predicted clean video (x̂₀) at successive denoising steps for the prompt
  *"a truck and a bird and a cow"* steered toward *"a bird"*.
  The highlighted cell (step 7) is expanded below: the four optimization iterations within that
  single denoising step show the probe score jumping from 0.61 → 0.99 within two iterations.

steering_process_caption: |
  **Top:** x̂₀ previews at selected denoising steps (step 7 highlighted in orange).
  **Bottom:** x̂₀ at every other optimization iteration inside step 7.

results_section_intro: |
  We evaluate over our own benchmark: extended 473 prompts of VBench multiple-objects dimension.

results_intro: |
  The table reports the detection ratio and the fraction of clips where *all* requested objects are
  detected, overall and by *k*, the number of requested objects. The gain grows with *k*.

results_all_objects_caption: "All-object accuracy vs. prompt complexity (*k* objects). Bands show &plusmn;1 SE."

vbench_intro: |
  AttnSteer preserves or improves video quality across all VBench dimensions.
  Each bar shows the per-dimension score for one backbone.

vbench_caption: "Per-dimension VBench scores. Higher is better for all dimensions."

results_table_note: |
  **Bold** = best within backbone block; <u>underline</u> = best overall.
  Inference cost measured on a single H100 GPU; &times;base = multiple of base-model generation time.

userstudy_text: |
  To confirm the improvement is visible to people, we ran a paired human-preference study on LTX-2
  and Wan&nbsp;2.1, comparing AttnSteer against Attend-and-Excite on object presence, photorealism,
  and motion smoothness. 37 volunteer annotators completed 622 clip judgements. AttnSteer is preferred
  on every question and both backbones. The largest margin is object presence on Wan&nbsp;2.1
  (73.9% of decisive votes); photorealism and motion smoothness — included as quality guardrails —
  also come out in our favor (58–67%).

userstudy_caption: "Bars show share of all votes; percentage at right = decisive-vote win rate for Ours."

single_object_text: |
  We evaluate on 79 VBench `object_class` single-object prompts as a guardrail:
  with only one requested object, backbones already succeed on most clips, and the goal is to verify
  that steering does not harm this easy regime. AttnSteer in fact improves single-object presence on
  LTX-2 under both detectors, while leaving VBench quality unchanged.

single_object_table_note: "**Bold** = best within backbone. <u>Underline</u> = best across all backbones."

carousel_caption_2: |
  Each clip shows the **base model** (left) alongside **AttnSteer** (right),
  generated from the same prompt and seed.

temporal_text: |
  The same learned objective applies frame by frame, so it can control *when* an object appears. On
  single-object prompts, where an object must enter at a prescribed time, AttnSteer raises specificity
  from 31.2% to 52.6%, meaning fewer frames before the requested onset are wrongly filled. Temporal
  alignment (t-IoU) rises from 40.6% to 45.0%, and VBench quality is unchanged (74.7 vs. 75.1).

temporal_examples_text: |
  TempoControl (left) vs. AttnSteer (right), played in sync. The timeline shows the requested control
  signal and the actual per-frame detections for each method.

temporal_examples_caption: "The five examples from the main paper (LTX-2, and Wan&nbsp;2.1 for the teddy bear)."

dataset_p1: |
  We introduce a 473-prompt multi-object benchmark that extends VBench's `multiple_objects` dimension
  from two to seven objects. Each prompt uses VBench's template ("a X and a Y and a Z …") and draws
  *k* objects at random from the same 76-class list, under a **pairwise-uniqueness constraint** — no
  two objects that share one prompt ever co-occur in another. Because combinations are sampled
  independently of natural co-occurrence, prompts are frequently unusual (e.g.,
  *"a pizza and a surfboard and a kite"*), which makes object presence hard and prevents generators
  from exploiting familiar scene statistics.

dataset_p2: |
  All three backbones (LTX-2, Wan&nbsp;2.1, CogVideoX-5B) and all arms (base model, Best-of-N,
  A&amp;E, Ours) are evaluated on the same 473 prompts, each with a fixed random seed shared
  across arms.

